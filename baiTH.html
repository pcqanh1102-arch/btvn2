<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang đăng ký Workshop HTML</title>
</head>
<body>
    <header>
        <h1>Tên Workshop HTML</h1>
        <nav>
            <a href="#gioi-thieu">Giới thiệu</a> |
            <a href="#dang-ky">Đăng ký</a> |
            <a href="#lien-he">Liên hệ</a>
        </nav>
    </header>
    <main>
        <section id="gioi-thieu">
            <h2>Học HTML qua dự án</h2>
            <p>
                Tham gia workshop để học cách xây dựng cấu trúc trang web
                bằng HTML semantic và thực hành trên dự án thực tế.
            </p>
        </section>
        <figure>
            <img src=""
                 alt="Minh họa workshop HTML">
            <figcaption>
                Hình minh họa cho workshop HTML.
            </figcaption>
        </figure>
        <section id="dang-ky">
            <h2>Đăng ký tham gia</h2>
            <form>
                <p>
                    <label for="name">Họ và tên:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>
                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <button type="submit">
                    Đăng ký
                </button>
            </form>
        </section>
    </main>
    <footer id="lien-he">
        <p>Email: workshop@example.com</p>
        <p>© 2026 Workshop HTML. All rights reserved.</p>
    </footer>
</body>
</html>
